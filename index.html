<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#030208">
    <meta name="color-scheme" content="dark">
    <title>Trung Thu 3D</title>
    <link rel="stylesheet" href="./assets/css.css">
</head>
<body>
    <div id="webgl-container" aria-hidden="true"></div>

    <div class="top-bar" aria-label="Điều khiển">
        <button class="icon-btn" id="audio-btn" type="button" aria-label="Bật nhạc" title="Bật/Tắt nhạc">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        </button>
        <button class="icon-btn" id="reset-cam-btn" type="button" aria-label="Đặt lại góc nhìn" title="Góc nhìn ban đầu">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M5.5 15a7 7 0 0 0 11.8 2.3L20 14M4 10l2.7-3.3A7 7 0 0 1 18.5 9"/></svg>
        </button>
    </div>

    <div class="click-hint">Chạm vào lồng đèn để mở một khoảnh khắc</div>

    <div class="wish-modal" id="wishModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="wishTitle">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn" type="button" aria-label="Đóng">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>

            <h3 id="wishTitle">Thông Điệp Gửi Cậu</h3>

            <div class="wish-image-container is-loading" id="wishImageContainer">
                <div class="image-loader" aria-hidden="true"></div>
                <img id="wishImage" alt="Khoảnh khắc Trung Thu" width="900" height="1600" decoding="async" loading="eager" draggable="false">
            </div>

            <p id="wishText">Chúc cậu một đêm Trung Thu ấm áp, bình an và trọn vẹn bên những người thương yêu.</p>
            <div class="tag">✦ Trung Thu An Lành ✦</div>
        </div>
    </div>

    <audio id="bgm" loop preload="none" src="./assets/1.mp3"></audio>

    <script src="./assets/three.min.js"></script>
    <script src="./assets/OrbitControls.js"></script>
    <script src="./assets/script.js"></script>
</body>
</html>
